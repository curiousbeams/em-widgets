  <title>A 4D-STEM experiment</title>
  <script id="1" type="text/markdown">
    # A 4D-STEM experiment

    Gold nanoparticles on an amorphous carbon film. The probe converges through
    the specimen and every scattered electron lands somewhere on the detector
    below — and *which part* of the detector you add up decides what the image
    shows.

    The scan runs by itself, filling the four signal panels as it goes.
    **Hover** over the scene to take the probe yourself; **click** to pin it.

    Nothing here is precomputed: the atoms, their projected potential, the exit
    wave, the diffraction pattern and every detector signal are computed in your
    browser — the same multislice abtem runs, on the full grid, agreeing with it
    to one part in a million.
  </script>

  <script id="3" type="text/x-typescript" pinned="">
    // 48 x 32 A. Small enough that every scan position is a full-grid multislice
    // — no windowing, so the exit wave and the diffraction pattern are exactly
    // what abtem would give for this cell.
    const fov = [48, 32]
  </script>
  <script id="4" type="text/x-typescript" pinned="">
    const sampling = [0.25, 0.25]
  </script>
  <script id="5" type="text/x-typescript" pinned="">

  </script>
  <script id="6" type="text/x-typescript" pinned="">
    // Fixed, rather than a slider. The largest angle a grid can represent is
    // lambda / 2dx, so changing the voltage would slide the whole detector range
    // out from under the reader: at 300 kV this grid would not reach the ADF
    // ring at all.
    const energy = 80e3
  </script>
  <script id="7" type="text/x-typescript" pinned="">

  <script id="8" type="text/x-typescript" pinned="">

    // multislice needs, so this — not the Nyquist angle — is the largest angle

  <script id="13" type="text/x-typescript" pinned="">

  <script id="21" type="text/x-typescript" pinned="">
    // Two gold particles at different orientations — one with a ⟨111⟩ zone axis
    // along the beam, one not — so the scan shows orientation contrast, pressed
    // into an amorphous carbon film.
    const specimen = (() => {
      const d = specimenControls.diameter;
      const t = specimenControls.support;
      const twist = (specimenControls.twist * Math.PI) / 180;
      const seed = 10;

      // The film occupies z ∈ [-t, 0], and each particle is truncated by its top
      // face — a Winterbottom construction: the equilibrium shape of a crystal on
      // a substrate is its Wulff polyhedron cut off at the interface, with the
      // depth of the cut set by the adhesion energy. Here that depth is a fixed
      // fraction of the particle's height.
      //
      // Truncating the GOLD, rather than hollowing out the film, is what keeps
      // the projected potential honest: no gold and carbon ever occupy the same
      // place, so nothing is counted twice.
      const wetting = 0.3;
      const onSubstrate = (atoms) => {
        let lowest = Infinity, highest = -Infinity;
        for (const p of atoms) {
          if (p[2] < lowest) lowest = p[2];
          if (p[2] > highest) highest = p[2];
        }
        const drop = lowest + wetting * (highest - lowest);
        return atoms
          .map((p) => [p[0], p[1], p[2] - drop])
          .filter((p) => p[2] >= 0);
      };

      const gold = [
        ...onSubstrate(fccCluster({diameter: d, zoneAxis: [1, 1, 1], twist,
                                   centre: [fov[0] * 0.27, fov[1] * 0.56, 0]})),
        ...onSubstrate(fccCluster({diameter: d * 0.7, twist: -twist * 0.7,
                                   centre: [fov[0] * 0.75, fov[1] * 0.34, 0]}))
      ];
      const carbon = amorphousSupport({extent: fov, thickness: t, z: -t / 2, seed});

      // The beam arrives from +z, so the entrance surface is the highest atom.
      let entrance = -Infinity, exit = Infinity;
      for (const p of [...gold, ...carbon]) {
        if (p[2] > entrance) entrance = p[2];
        if (p[2] < exit) exit = p[2];
      }
      return {gold, carbon, entrance, exit, thickness: entrance - exit};
    })()
  </script>
  <script id="21b" type="text/x-typescript" pinned="">
    // Film beyond the simulated cell, for the 3D view only. Without it the
    // specimen ends in mid-air at the edge of the field, which reads as a small
    // chip of carbon rather than as a film the probe is scanning a patch of.
    // These atoms are never given to `projectedPotential` — the simulation stays
    // exactly the 48 x 32 Å cell the scan covers.
    const carbonSurround = (() => {
      const t = specimenControls.support;
      const pad = fov[0] * 0.7;
      // Extended in x only. Widening it in y too would push atoms outside the
      // depth range the camera was fitted to, and they project as a thicker,
      // wavier band than the film inside the cell — the join then shows.
      const wide = amorphousSupport({
        extent: [fov[0] + 2 * pad, fov[1]],
        thickness: t, z: -t / 2, seed: 27,
        origin: [-pad, 0]
      });
      return wide.filter((p) => p[0] < 0 || p[0] > fov[0]);
    })()
  </script>
  <script id="22" type="text/x-typescript" pinned="">
    // Multislice cuts the specimen into slabs of about this thickness, so the
    // slice count follows the specimen instead of being a number the reader has
    // to pick. A thin film needs two slices; a tall particle needs several.
    const nSlices = multisliceOn
      ? Math.max(2, Math.round(specimen.thickness / 4))
      : 1
  </script>
  <script id="23" type="text/x-typescript" pinned="">
    // Projected potential per slice — the Lobato/Fourier superposition abtem
    // uses, with the atoms binned by depth first. One FFT pair per element per
    // slice, a few milliseconds in all, and only when the specimen changes.
    //
    // Binning the real atoms is the difference between multislice and simply
    // dividing one projected potential into equal shares: the latter propagates
    // between slices that are all identical, which cannot produce any depth
    // information at all.
    const potential = (() => {
      const {entrance, exit} = specimen;
      const dz = Math.max(1e-6, (entrance - exit) / nSlices);
      // Slice 0 is the entrance slice: the beam arrives from +z.
      const sliceOf = (p) =>
        Math.min(nSlices - 1, Math.max(0, Math.floor((entrance - p[2]) / dz)));
      const inSlice = (atoms, s) =>
        atoms.filter((p) => sliceOf(p) === s).map((p) => [p[0], p[1]]);
      return Array.from({length: nSlices}, (_, s) => projectedPotential(
        [
          {symbol: "Au", positions: inSlice(specimen.gold, s)},
          {symbol: "C", positions: inSlice(specimen.carbon, s)}
        ],
        {gpts, sampling}
      ));
    })()
  </script>
  <script id="24" type="text/x-typescript" pinned="">
    const doseValue = optics.dose === "∞" ? Infinity : Number(optics.dose)
  </script>
  <script id="25" type="text/x-typescript" pinned="">
    // One transmission function per slice. Band-limited, because multislice
    // aliases badly without it — see `antialiasAperture` in the kit.
    const transmission = (() => {
      const sigma = interactionParameter(energy);
      return potential.map((V) => {
        const phase = new Float64Array(V.length);
        for (let i = 0; i < V.length; i++) phase[i] = V[i] * sigma;
        return bandlimit(expi(phase), gpts, sampling);
      });
    })()
  </script>
  <script id="26" type="text/x-typescript" pinned="">
    const propagator = fresnelPropagator(
      gpts, sampling, energy, specimen.thickness / nSlices
    )
  </script>
  <script id="27" type="text/x-typescript" pinned="">
    const angular = angularSpatialFrequencies(gpts, sampling, wavelength)
  </script>
  <script id="28" type="text/x-typescript" pinned="">
    // Detector radii in mrad, clamped to the angle the grid can represent.
    const angles = (() => {
      const a = optics.semiangle;
      const cap = (v) => Math.min(maxAngle, v * a);
      return {
        alpha: a,
        inner: cap(instrument.inner),
        outer: cap(instrument.outer),
        adfOuter: cap(instrument.adfOuter)
      };
    })()
  </script>
  <script id="29" type="text/x-typescript" pinned="">
    const detector = segmentedDetector(angular, {
      inner: angles.inner,
      outer: angles.outer,
      sectors: instrument.sectors,
      rotation: (instrument.rotation * Math.PI) / 180
    })
  </script>
  <script id="30" type="text/x-typescript" pinned="">
    // One index map for all sixteen segments plus ABF and ADF, so a scan position
    // costs one pass over the pattern instead of eighteen.
    const detectorIndex = (() => {
      const n = detector.masks.length;
      return {
        segments: segmentIndex(detector.masks, angular.alpha.length),
        adf: annularMask(angular, angles.outer, angles.adfOuter),
        n,
        sums: new Float64Array(n)
      };
    })()
  </script>
  <script id="31" type="text/x-typescript" pinned="">
    // Zero defocus puts the waist at the MIDDLE of the specimen, which is where
    // a microscopist focuses. Multislice necessarily builds the probe at the
    // entrance plane, so the aberration carries the extra half-thickness.
    //
    // The waist sits `-C10` downstream of the plane the probe was built on —
    // measured, and asserted in `test/multislice.test.js`, because this sign
    // flipped when the propagator's did and nothing about the picture said so.
    const focusOffset = specimen.thickness / 2
  </script>
  <script id="31b" type="text/x-typescript" pinned="">
    // The probe sits at index (0, 0), so moving to a scan position is a plain
    // index shift — no phase ramp, no extra transform.
    const probe = ifft2(
      complexProbe({
        gpts, sampling, energy,
        semiangleCutoff: optics.semiangle,
        aberrations: {C10: -(optics.defocus + focusOffset)}
      }),
      gpts[0], gpts[1]
    )
  </script>
  <script id="32" type="text/x-typescript" pinned="">
    // One scan position: shift the probe, propagate, collect every detector.
    //
    // The probe moves by reading it at a rolled index rather than by a Fourier
    // phase ramp. That is exact whenever the step is a whole number of pixels
    // (`scan` enforces that) and it saves an FFT per position.
    const measureAt = (atRow, atCol, {keepExit = false} = {}) => {
      const [nx, ny] = gpts;
      const psi = {re: new Float64Array(nx * ny), im: new Float64Array(nx * ny)};
      // Each row of the shifted probe is two contiguous runs of a row of the
      // unshifted one, so `set` moves them wholesale. Indexing pixel by pixel
      // costs two modulo operations per pixel, which on a 192x128 grid is fifty
      // thousand of them per scan position.
      const rot = (((atCol % ny) + ny) % ny);
      for (let i = 0; i < nx; i++) {
        const si = (((i - atRow) % nx) + nx) % nx;
        const from = si * ny, to = i * ny;
        for (const a of [probe.re, probe.im]) {
          const out = a === probe.re ? psi.re : psi.im;
          out.set(a.subarray(from, from + ny - rot), to + rot);
          out.set(a.subarray(from + ny - rot, from + ny), to);
        }
      }

      // Stop in Fourier space: that is where the detector lives, and for a
      // single slice the round trip back to real space and forward again is two
      // of the three transforms in the whole calculation. The exit wave itself
      // is only wanted for the one position on display.
      const spectrum = multisliceSpectrum(psi, transmission, propagator, nx, ny);
      const exit = keepExit
        ? ifft2({re: Float64Array.from(spectrum.re), im: Float64Array.from(spectrum.im)}, nx, ny)
        : null;

      // |psi|^2 directly: `abs` then squaring would take a square root per pixel
      // and immediately undo it, twenty-five thousand times per scan position.
      const I = new Float64Array(nx * ny);
      let total = 0;
      for (let i = 0; i < I.length; i++) {
        I[i] = spectrum.re[i] * spectrum.re[i] + spectrum.im[i] * spectrum.im[i];
        total += I[i];
      }

      // Shot noise, in electrons per diffraction pattern.
      if (Number.isFinite(doseValue) && total > 0) {
        const perElectron = doseValue / total;
        let noisy = 0;
        for (let i = 0; i < I.length; i++) { I[i] = poisson(I[i] * perElectron); noisy += I[i]; }
        total = noisy;
      }
      const norm = total || 1;

      let adf = 0;
      for (let i = 0; i < I.length; i++) adf += I[i] * detectorIndex.adf[i];

      const sums = integrateByIndex(I, detectorIndex.segments, detectorIndex.n,
                                    detectorIndex.sums);
      // Annular bright field is the segmented detector's own total — the same
      // electrons the centre of mass is computed from, just not resolved by
      // sector. One pass over the pattern now serves both.
      let abf = 0;
      for (let i = 0; i < sums.length; i++) abf += sums[i];
      // Normalised by the WHOLE pattern, not by the segments alone, so the
      // signal also carries how much intensity reached the detector — the
      // convention `08_segmented-icom` uses.
      const com = centreOfMassFromSegments(sums, detector.centroids, norm);
      return {
        abf: abf / norm, adf: adf / norm,
        comX: com.kx, comY: com.ky,
        intensity: I,
        exit
      };
    }
  </script>
  <script id="33" type="text/x-typescript" pinned="">
    // Everything that invalidates a signal is a dependency, so the buffers clear
    // themselves when any of it changes — and `clearCount` forces the same.
    const scan = (() => {
      optics; instrument; specimenControls; clearCount; nSlices;
      // A whole number of pixels per step, so shifting the probe by an index is
      // exact rather than interpolated.
      const stride = Math.max(1, Math.round(instrument.step / sampling[0]));
      const nx = Math.floor(gpts[0] / stride);
      const ny = Math.floor(gpts[1] / stride);
      return {
        stride, nx, ny, cursor: 0, count: 0,
        paintedRows: -1, paintedAt: 0,
        step: [stride * sampling[0], stride * sampling[1]],
        abf: new Float64Array(nx * ny),
        adf: new Float64Array(nx * ny),
        comX: new Float64Array(nx * ny),
        comY: new Float64Array(nx * ny),
        seen: new Uint8Array(nx * ny)
      };
    })()
  </script>
  <script id="34" type="text/x-typescript" pinned="">
    // One measurement per probe position, kept until something invalidates it.
    //
    // Without this the displayed pattern is re-simulated 30 times a second even
    // when nothing moves, and at a finite dose every frame draws fresh Poisson
    // samples — the pattern boils. Depending on `measureAt` is what makes the
    // cache correct: the cell, and the cache with it, is rebuilt whenever the
    // optics, the detector or the specimen change.
    const displayCache = (() => { measureAt; return {key: null, value: null}; })()
  </script>
  <script id="35" type="text/x-typescript" pinned="">

  <script id="35b" type="text/x-typescript" pinned="">
    // The rendered image for each signal panel, held at panel resolution.

        panel.ctx.strokeStyle = "rgba(255,255,255,0.95)";
        panel.ctx.beginPath(); panel.ctx.arc(mx, my, 4, 0, 2 * Math.PI); panel.ctx.stroke();
        panel.ctx.restore();
      });

      readout.textContent =
        `${optics.semiangle} mrad · 80 kV · ${nSlices === 1 ? "1 slice" : `${nSlices} slices`} · ` +
        `scan ${scan.count}/${cells} at ${scan.step[0].toFixed(2)} Å · ` +
        `${(performance.now() - started).toFixed(0)} ms/frame` +
        (batch ? ` (${batch} pos)`
          : complete ? " · complete"
          : !scanning ? " · paused"
          : probeState.pinned ? " · pinned"
          : probeState.hovering ? " · following the pointer"
          : " · idle");
      return started;
    })()
